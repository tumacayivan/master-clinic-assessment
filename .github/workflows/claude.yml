# Claude on GitHub, when somebody asks for it.
#
# Write @claude in a pull request or issue comment - "@claude review this",
# "@claude why does this page break on mobile?" - and Claude reads
# the repository and answers in the thread. Nothing runs on its own: no
# comment, no run, so it spends nothing while nobody is asking.
#
# It signs in with CLAUDE_CODE_OAUTH_TOKEN, a repository secret made with
# `claude setup-token`, so the runs come out of the Claude subscription
# rather than a separate API bill. The Claude GitHub App
# (https://github.com/apps/claude) must also be installed on the repository.
#
# Only people with write access to the repository can set it off; a stranger's
# comment is ignored by the action.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
